services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: tabyldy
      POSTGRES_USER: tabyldy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD using a secret manager}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U tabyldy -d tabyldy"]
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://tabyldy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/tabyldy
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - storage:/app/storage
      - models:/app/models
    depends_on:
      db:
        condition: service_healthy
  admin:
    build: ../admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  postgres:
  storage:
  models:
