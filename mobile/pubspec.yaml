name: tabyldy
description: "Табылды — мобильная платформа поиска и возврата потерянных вещей."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  cached_network_image: ^4.0.6
  web_socket_channel: ^3.0.3
  google_fonts: ^9.0.0
  cupertino_icons: ^1.0.8
  geolocator: ^14.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
