# Render Blueprint: free web service plus a free Render PostgreSQL, wired together
# automatically. Render's free database lasts 30 days; to keep data longer, replace
# DATABASE_URL in the service's Environment with a Neon connection string.
databases:
  - name: tabyldy-db
    plan: free
    region: frankfurt
    databaseName: tabyldy
    user: tabyldy
services:
  - type: web
    name: tabyldy
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tabyldy-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      # The free service has no persistent disk: photos live in the database.
      - key: STORAGE_DRIVER
        value: db
      # First team account for the panel at /admin. Created once, only while no admin
      # exists; the password is generated by Render (Environment tab). Two-factor
      # sign-in is set up on first login.
      - key: ADMIN_BOOTSTRAP_EMAIL
        value: admin@tabyldy.kg
      - key: ADMIN_BOOTSTRAP_PASSWORD
        generateValue: true
      # No SMS provider yet: people use the app as guests, phone sign-in is off.
      - key: OTP_DELIVERY
        value: console
      - key: OTP_CONSOLE_IN_PRODUCTION
        value: "true"
